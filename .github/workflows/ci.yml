name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck e2fsprogs zstd zip
      - name: shellcheck
        run: git ls-files 'lineage-gsi/*.sh' 'tests/*.sh' | xargs shellcheck -x -P SCRIPTDIR
      - name: python syntax
        run: python3 -m py_compile lineage-gsi/lib/*.py tools/*.py tests/*.py
      - name: pipeline tests
        run: tests/test-pipeline.sh
      - name: kernel-facts tests
        run: python3 tests/test_kernel_facts.py
